name: Bug report
description: Something behaves incorrectly.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Spoor is local-first and holds personal data. **Do not paste real
        personal data** (people, places, your database file) into this issue.
        Reproduce with dummy data where you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the exact error text if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version or git commit SHA.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: data-risk
    attributes:
      label: Data impact
      description: Did any data look lost, duplicated, or corrupted? This is our highest-priority class of bug.
    validations:
      required: false
