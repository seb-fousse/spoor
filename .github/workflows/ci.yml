name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Reads the pinned version from package.json "packageManager".
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Builds @spoor/core and the desktop *frontend* (Vite). The Tauri/Rust
      # side is built and tested by the `tauri` job below.
      - name: Build
        run: pnpm build

  # Decides whether the Tauri job needs to run. A job-level filter (rather than
  # workflow-level `on.paths`) keeps the check reporting on every PR, so it can
  # be made required without blocking unrelated changes.
  changes:
    name: detect desktop changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  tauri:
    name: tauri build · rust test
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # System libraries Tauri needs to compile on Linux (WebKitGTK etc.).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Compiles the release binary (and the frontend via beforeBuildCommand)
      # without producing installer bundles; packaging belongs to release CI.
      - name: Tauri build
        run: pnpm desktop:build --no-bundle
