name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Reads the pinned version from package.json "packageManager".
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Builds @spoor/core and the desktop *frontend* (Vite). It does NOT build
      # the Tauri/Rust bundle, which needs the Rust toolchain and OS libraries;
      # add a dedicated job for that once the Tauri+SQLite spike lands.
      - name: Build
        run: pnpm build
