version: 2

updates:
  # JavaScript/TypeScript dependencies (single pnpm lockfile at the root).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One grouped PR keeps review light. Reviewed by hand, never auto-merged.
      npm-dependencies:
        patterns: ["*"]

  # Rust crates for the Tauri desktop shell.
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-dependencies:
        patterns: ["*"]

  # Pinned GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
